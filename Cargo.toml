[workspace]
resolver = "2"
members = [
    "crates/sdkwork-api-voice-assembly",
    "crates/sdkwork-voice-contract",
    "crates/sdkwork-voice-service",
    "crates/sdkwork-voice-generation-provider-spi",
    "crates/sdkwork-voice-generation-provider-adapter",
    "crates/sdkwork-voice-generation-mcp-service",
    "crates/sdkwork-voice-embedded-bootstrap",
    "crates/sdkwork-api-voice-standalone-gateway",
    "crates/sdkwork-api-voice-assembly",
    "crates/sdkwork-voice-database-host",
    "crates/sdkwork-routes-voice-http-auth",
    "crates/sdkwork-routes-voice-app-api",
    "crates/sdkwork-routes-voice-backend-api",
    "crates/sdkwork-voice-artifact-drive-service",
    "crates/sdkwork-voice-drive-sync-processor",
    "crates/sdkwork-voice-generation-repository-sqlx",
    "crates/sdkwork-voice-local-api-proxy-native-host",
]

[workspace.package]
rust-version = "1.85"
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"
publish = false

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
rmcp = { version = "2.2.0", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
async-trait = "0.1"
axum = "0.8"
http = "1.3"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
cloudrouter-open-sdk = { path = "../sdkwork-cloudrouter/sdks/cloudrouter-open-sdk/cloudrouter-open-sdk-rust/generated/server-openapi" }
sdkwork-drive-config = { path = "../sdkwork-drive/crates/sdkwork-drive-config" }
sdkwork-drive-storage-contract = { path = "../sdkwork-drive/crates/sdkwork-drive-storage-contract" }
sdkwork-drive-storage-local = { path = "../sdkwork-drive/crates/sdkwork-drive-storage-local" }
sdkwork-drive-workspace-service = { path = "../sdkwork-drive/crates/sdkwork-drive-workspace-service" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config", package = "sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi", package = "sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork-voice-contract = { path = "crates/sdkwork-voice-contract" }
sdkwork-voice-service = { path = "crates/sdkwork-voice-service" }
sdkwork-voice-generation-provider-spi = { path = "crates/sdkwork-voice-generation-provider-spi" }
sdkwork-voice-generation-provider-adapter = { path = "crates/sdkwork-voice-generation-provider-adapter" }
sdkwork-voice-generation-mcp-service = { path = "crates/sdkwork-voice-generation-mcp-service" }
sdkwork-voice-embedded-bootstrap = { path = "crates/sdkwork-voice-embedded-bootstrap" }
sdkwork-voice-database-host = { path = "crates/sdkwork-voice-database-host" }
sdkwork-voice-generation-repository-sqlx = { path = "crates/sdkwork-voice-generation-repository-sqlx" }
sdkwork-voice-artifact-drive-service = { path = "crates/sdkwork-voice-artifact-drive-service" }
sdkwork-voice-drive-sync-processor = { path = "crates/sdkwork-voice-drive-sync-processor" }
sdkwork-routes-voice-http-auth = { path = "crates/sdkwork-routes-voice-http-auth" }
sdkwork-routes-voice-app-api = { path = "crates/sdkwork-routes-voice-app-api" }
sdkwork-routes-voice-backend-api = { path = "crates/sdkwork-routes-voice-backend-api" }
sdkwork-api-voice-assembly = { path = "crates/sdkwork-api-voice-assembly" }
