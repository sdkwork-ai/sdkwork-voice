# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/voice/webserver.pid;
error_log /var/log/sdkwork/voice/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name voice-demo.sdkwork.com voice-demo.birdcoder.com voice-demo.dtupay.com voice-demo.noaper.com voice-demo.sdkwork.cn voice-demo.birdcoder.cn voice-demo.dtupay.cn voice-demo.noaper.cn voice-demo.skubc.com voice-demo.skubc.cn voice-demo.zowalk.com voice-demo.zowalk.cn voice-demo.offer86.com voice-demo.offer86.cn voice-demo.86offer.com voice-demo.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
